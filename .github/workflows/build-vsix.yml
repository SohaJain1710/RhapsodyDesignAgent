name: Build VSIX

# - Every push / pull request: build the VSIX and attach it to the workflow run
#   (Actions tab -> run -> "Artifacts" section).
# - Pushing a tag like v0.0.4: also publish a GitHub Release with the VSIX attached
#   (repo -> Releases), so anyone with repo access can download it.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create Releases on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Bundle Python runtime + packages (Windows x64)
        run: python scripts/bundle_python.py

      - name: Check extension and Python tools
        run: |
          node --check src/extension.js
          python3 -m py_compile tools/*.py

      - name: Use tag as version
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Package VSIX
        run: npx vsce package --skip-license --target win32-x64

      - name: Find VSIX
        id: vsix
        run: echo "path=$(ls *.vsix)" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vsix.outputs.path }}
          path: ${{ steps.vsix.outputs.path }}
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.vsix.outputs.path }}
          generate_release_notes: true
